name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: signal-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ARDUINO_CLI_VERSION: 1.5.0
  ARDUINO_NETWORK_CONNECTION_TIMEOUT: 240s
  ESP32_CORE_VERSION: 3.3.9
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19
  STRATA_REF: 5bc7a67c8a06487e9d9ecef265f6c24539c28441

jobs:
  source-audit:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production sources
        run: |
          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi
          if grep -RInE 'ESP_LOG[A-Z]*[[:space:]]*\(|Serial[.]|Serial[[:space:]]*->' src; then
            echo "Signal internals must not use ESP-IDF or Arduino logging"
            exit 1
          fi

          if grep -RInE 'heap_caps_|MALLOC_CAP_|ps_malloc|xTaskCreate|vTaskDelete|xQueueCreate|xSemaphoreCreate|std::make_unique|std::make_shared|(^|[^[:alnum:]_])malloc[[:space:]]*\(|(^|[^[:alnum:]_])calloc[[:space:]]*\(|(^|[^[:alnum:]_])realloc[[:space:]]*\(|(^|[^[:alnum:]_])free[[:space:]]*\(|(^|[^[:alnum:]_])new[[:space:](]|(^|[^[:alnum:]_])delete[[:space:](]' src; then
            echo "Signal allocations and owned FreeRTOS primitives must route through Strata"
            exit 1
          fi

          if grep -RInE '#include[[:space:]]+[<"]esp_heap_caps\.h[>"]|freertos/idf_additions\.h' src; then
            echo "Signal must not depend on ESP-IDF allocation internals"
            exit 1
          fi

  metadata-validation:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate package version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python3 scripts/check_version.py "${GITHUB_REF_NAME}"
          else
            python3 scripts/check_version.py
          fi

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: false
          project-type: library

  host-tests:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned Strata
        run: |
          set -e
          STRATA_DIR="${RUNNER_TEMP}/signal-strata"
          rm -rf "$STRATA_DIR"
          git clone https://github.com/ZekStack/strata.git "$STRATA_DIR"
          git -C "$STRATA_DIR" checkout "${STRATA_REF}"

      - name: Build host runtime tests
        run: |
          STRATA_DIR="${RUNNER_TEMP}/signal-strata"
          g++ \
            -std=c++20 \
            -Wall \
            -Wextra \
            -Werror \
            -pthread \
            -Itests/host/fakes \
            -Itests/host \
            -Isrc \
            -I"$STRATA_DIR/src" \
            tests/host/fake_freertos.cpp \
            tests/host/test_signal.cpp \
            src/Signal.cpp \
            "$STRATA_DIR/src/strata/Allocation.cpp" \
            "$STRATA_DIR/src/strata/Diagnostics.cpp" \
            "$STRATA_DIR/src/strata/internal/PlatformGeneric.cpp" \
            "$STRATA_DIR/src/strata/internal/PlatformEsp32.cpp" \
            -o signal-host-tests

      - name: Run host runtime tests
        run: ./signal-host-tests

  build-examples:
    runs-on: [self-hosted, zekstack-ci]
    needs: source-audit
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure writable PIOArduino directories
        run: |
          echo "PLATFORMIO_CORE_DIR=${RUNNER_TEMP}/signal-platformio" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=${RUNNER_TEMP}/signal-pip-cache" >> "$GITHUB_ENV"

      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/signal-platformio
            ${{ runner.temp }}/signal-pip-cache
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install PIOArduino ESP32 Platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build library examples
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Building $d on ${{ matrix.board }}"
              pio ci "$d" \
                --board ${{ matrix.board }} \
                --lib="." \
                --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
                --project-option "lib_deps=https://github.com/ZekStack/strata.git#${STRATA_REF}" \
                --project-option "build_unflags=-std=gnu++11" \
                --project-option "build_flags=-std=gnu++20"
            fi
          done

  arduino-cli:
    runs-on: [self-hosted, zekstack-ci]
    needs: [source-audit, build-examples]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        board:
          - fqbn: esp32:esp32:esp32
            name: esp32dev
          - fqbn: esp32:esp32:esp32s3
            name: esp32-s3-devkitc-1
          - fqbn: esp32:esp32:esp32c3
            name: esp32-c3-devkitm-1
          - fqbn: esp32:esp32:esp32p4
            name: esp32-p4-evboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure writable Arduino directories
        run: |
          echo "ARDUINO_DIRECTORIES_DATA=${RUNNER_TEMP}/signal-arduino/data" >> "$GITHUB_ENV"
          echo "ARDUINO_DIRECTORIES_DOWNLOADS=${RUNNER_TEMP}/signal-arduino/downloads" >> "$GITHUB_ENV"
          echo "ARDUINO_DIRECTORIES_USER=${RUNNER_TEMP}/signal-arduino/user" >> "$GITHUB_ENV"

      - name: Cache Arduino CLI packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/signal-arduino/data
            ${{ runner.temp }}/signal-arduino/downloads
          key: ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ESP32_CORE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-arduino-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"

      - name: Add local libraries to sketchbook
        run: |
          set -e
          SKETCHBOOK_DIR="${ARDUINO_DIRECTORIES_USER}"
          mkdir -p "$SKETCHBOOK_DIR/libraries/Signal"
          rsync -a --delete --exclude ".git" ./ "$SKETCHBOOK_DIR/libraries/Signal/"
          rm -rf "$SKETCHBOOK_DIR/libraries/Strata"
          git clone https://github.com/ZekStack/strata.git "$SKETCHBOOK_DIR/libraries/Strata"
          git -C "$SKETCHBOOK_DIR/libraries/Strata" checkout "${STRATA_REF}"

      - name: Build examples (${{ matrix.board.name }})
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -e
          for d in examples/*; do
            if [ -d "$d" ]; then
              echo "Compiling $d"
              arduino-cli compile \
                --fqbn "$FQBN" \
                --build-property "compiler.cpp.extra_flags=-std=gnu++20" \
                "$d"
            fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-audit, metadata-validation, host-tests, build-examples, arduino-cli]
    runs-on: [self-hosted, zekstack-ci]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release changelog
        run: |
          python3 scripts/generate_release_changelog.py \
            --target-ref "${GITHUB_REF_NAME}" \
            --tag-name "${GITHUB_REF_NAME}" \
            --output "release-changelog.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body_path: release-changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
